algorithm: maskable_ppo
seed: 0
total_timesteps: 64

env:
  map_file: maps/1v1/starter.csv
  opponent: noop
  max_steps: 64
  max_turns: 12
  n_envs: 1
  use_subprocess: false
  action_space_type: multi_discrete

ppo:
  learning_rate: 3.0e-4
  n_steps: 32
  batch_size: 16
  n_epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_action_masking: true
  device: cpu

eval:
  eval_freq: 64
  n_eval_episodes: 1
  checkpoint_freq: 64

logging:
  log_dir: tmp/learning-guide-v2/maskable-ppo
  tensorboard: false
  wandb: false

