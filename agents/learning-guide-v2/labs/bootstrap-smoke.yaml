algorithm: maskable_ppo
seed: 42
total_timesteps: 64

env:
  n_envs: 1
  use_subprocess: false
  max_steps: 32
  max_turns: 10
  action_space_type: flat_discrete
  max_flat_actions: 128
  reward_config:
    win: 10.0
    loss: -10.0
    draw: -2.0
    invalid_action: -0.1
    capture: 2.0
    seize_progress: 1.0

ppo:
  learning_rate: 3.0e-4
  n_steps: 32
  batch_size: 32
  n_epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

eval:
  eval_freq: 32
  n_eval_episodes: 1

curriculum:
  stages:
    - name: starter_pipeline_smoke
      map_file: maps/1v1/starter.csv
      opponent: noop
      promotion_win_rate: 0.0
      patience: 1
      min_timesteps_before_promotion: 32
      max_timesteps: 64
      n_eval_episodes: 1
      max_turns: 10
      ent_coef: 0.01

logging:
  tensorboard: false
  wandb: false
